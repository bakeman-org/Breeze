include:
  - package:flutter_lints/flutter.yaml

linter:
  rules:
    always_use_package_imports: true
    non_constant_identifier_names: false
    constant_identifier_names: false

analyzer:
  exclude:
    - "DART_T~1/**"
    # FRB / ObjectBox / freezed / json_serializable 生成代码，请勿手改
    - "lib/src/rust/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/util/router/router.gr.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
